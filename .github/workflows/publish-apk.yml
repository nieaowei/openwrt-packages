name: Publish OpenWrt APK feed

on:
  push:
    branches: [build]
    paths:
      - 'sources.json'
      - 'scripts/**'
      - 'packages/**/*.apk'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-apk-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/build'
    # Only download verified GitHub Release assets; never execute or build source code here.
    name: Collect prebuilt APKs from GitHub Releases
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout feed repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Copy manually checked-in APKs
        shell: bash
        run: |
          mkdir -p collected/packages
          cp -a packages/. collected/packages/

      - name: Download release APKs and check SHA256
        run: python3 scripts/collect-releases.py "$GITHUB_WORKSPACE/collected/packages"

      - name: Verify collection is nonempty
        shell: bash
        run: |
          set -euo pipefail
          if ! find collected/packages -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::No APKs were collected"
            exit 1
          fi
          find collected/packages -type f -name '*.apk' -print | sort

      - name: Upload collected APKs
        uses: actions/upload-artifact@v4
        with:
          name: collected-openwrt-apks
          path: collected
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Sign APKs and publish feed to main
    needs: [collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout feed scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download collected APKs
        uses: actions/download-artifact@v4
        with:
          name: collected-openwrt-apks
          path: collected

      - name: Install SDK extraction dependency
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download verified OpenWrt SDK for apk-tools v3
        shell: bash
        env:
          SDK_VERSION: '25.12.6'
          SDK_TARGET: 'mediatek/filogic'
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/$SDK_VERSION/targets/$SDK_TARGET"
          curl --fail --location --retry 3 --silent --show-error "$base/sha256sums" -o "$RUNNER_TEMP/sha256sums"
          sdk="$(awk '{ print $2 }' "$RUNNER_TEMP/sha256sums" | sed 's/^\*//' | grep -E '^openwrt-sdk-.*\.tar\.zst$' | head -n 1)"
          if [ -z "$sdk" ]; then
            echo "::error::No OpenWrt SDK archive in $base"
            exit 1
          fi
          curl --fail --location --retry 3 --silent --show-error "$base/$sdk" -o "$RUNNER_TEMP/$sdk"
          (
            cd "$RUNNER_TEMP"
            awk -v n="$sdk" '{ f=$2; sub(/^\*/, "", f); if (f == n) print }' sha256sums | sha256sum --check
          )
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf "$RUNNER_TEMP/$sdk" -C "$RUNNER_TEMP/sdk" --strip-components=1
          test -x "$RUNNER_TEMP/sdk/staging_dir/host/bin/apk"
          echo "APK_BIN=$RUNNER_TEMP/sdk/staging_dir/host/bin/apk" >> "$GITHUB_ENV"

      - name: Sign packages and generate signed indexes
        shell: bash
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APK_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Configure the APK_SIGNING_PRIVATE_KEY Actions secret first"
            exit 1
          fi
          key="$RUNNER_TEMP/apk-private-key.pem"
          (umask 077; printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > "$key")
          PACKAGES_DIR="$GITHUB_WORKSPACE/collected/packages" \
          SIGNING_KEY="$key" SITE_DIR="$GITHUB_WORKSPACE/site" \
          bash scripts/build-feed.sh
          cp "$GITHUB_WORKSPACE/collected/source-provenance.json" "$GITHUB_WORKSPACE/site/sources.json"
          rm -f "$key"

      - name: Checkout current published branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: published

      - name: Commit signed feed to main
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/.nojekyll
          test -f published/.github/workflows/publish-apk.yml
          # Keep main's scheduler and Git metadata; replace only the feed contents.
          # Generated metadata and freshly checked-out files can share size and mtime.
          rsync -a --checksum --delete --exclude='/.git/' --exclude='/.github/' site/ published/
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync signed OpenWrt APK feed'
            git push origin HEAD:refs/heads/main
          fi

      - name: Request Pages build from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes do not trigger Pages automatically.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
